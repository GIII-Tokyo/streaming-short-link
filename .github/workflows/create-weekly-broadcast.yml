name: Create weekly YouTube broadcast

on:
  # Monday 10:00 JST
  schedule:
    - cron: "0 1 * * 1"

  workflow_dispatch:
    inputs:
      profile:
        description: Broadcast profile
        required: true
        default: all
        type: choice
        options:
          - all
          - sunday-service
          - test-stream

      target_date:
        description: >
          Broadcast date in YYYY-MM-DD. Leave empty for next Sunday.
        required: false
        type: string

      dry_run:
        description: Validate without changing YouTube
        required: true
        default: true
        type: boolean

concurrency:
  group: weekly-youtube-create
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Create placeholder broadcasts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

          YOUTUBE_TIME_ZONE: ${{ vars.YOUTUBE_TIME_ZONE }}
          YOUTUBE_PLAYLIST_ID: ${{ vars.YOUTUBE_PLAYLIST_ID }}
          YOUTUBE_START_TIME: ${{ vars.YOUTUBE_START_TIME }}
          YOUTUBE_TEST_START_TIME: ${{ vars.YOUTUBE_TEST_START_TIME }}

          YOUTUBE_STREAM_ID: ${{ secrets.YOUTUBE_STREAM_ID }}

          YOUTUBE_BROADCAST_CONFIG: config/youtube-broadcasts.json
          PROCESS_MODE: create-only

          SELECTED_PROFILE: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.profile
                || 'all' }}

          TARGET_DATE: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.target_date
                || '' }}

          DRY_RUN: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.dry_run
                || false }}

          UPDATE_SHORT_IO: "false"

        run: node scripts/create-weekly-broadcast.mjs

